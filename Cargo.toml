[package]
name = "gitlab-mcp"
version = "0.1.0"
edition = "2024"
description = "GitLab MCP server in Rust — data-driven tool registry over the GitLab REST/GraphQL API"
license = "MIT"

[dependencies]
rmcp = { version = "3.2", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "rustls-native-certs", "webpki-roots", "gzip", "http2", "charset", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
percent-encoding = "2"
base64 = "0.22"
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
